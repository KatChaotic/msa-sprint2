apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-service-feature-header-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
  - applyTo: HTTP_ROUTE
    match:
      context: GATEWAY
      routeConfiguration:
        vhost:
          name: "*:80"
          route:
            action: ANY
    patch:
      operation: INSERT_FIRST
      value:
        name: "booking-service-feature-header-filter"
        match:
          headers:
          - name: "x-feature-enabled"
            exact_match: "true"
          prefix: "/"
        route:
          cluster: "outbound|80|v2|booking-service.default.svc.cluster.local"
  