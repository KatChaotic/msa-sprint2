stages:
  - build
  - test
  - deploy
  - tag

variables:
  APP_NAME: booking-service
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service

build:
  # Не работает на windows вместе с gitlab-ci-local
  # image: docker:dind
  stage: build
  script:
    - echo "Building $IMAGE_NAME:$IMAGE_TAG"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG ./booking-service

test:
  stage: test
  before_script:
    - echo "Testing $IMAGE_NAME:$IMAGE_TAG"
    - docker run -d --name $APP_NAME-$CI_JOB_ID -p 8080:8080 $IMAGE_NAME:$IMAGE_TAG
  script:
    - curl --fail http://localhost:8080/ping && echo "✅ Reachable"
  after_script:
    - docker rm -f $APP_NAME-$CI_JOB_ID

deploy:
  stage: deploy
  script:
    - echo "Deploying $IMAGE_NAME:$IMAGE_TAG"
    - minikube image load $IMAGE_NAME:$IMAGE_TAG
    - helm upgrade $APP_NAME ./helm/booking-service

tag:
  stage: tag
  script:
    - TAG_NAME=$(date +%s)
    - git tag -a $TAG_NAME -m "$APP_NAME released $TAG_NAME"
 